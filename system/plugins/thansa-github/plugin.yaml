name: GitHub trong khung chat
name_en: "GitHub in chat"
slug: thansa-github
version: 1.1.0
description: Xem trạng thái repo GitHub của khung chat (nhánh, PR, CI, merge), xếp việc kế tiếp để Thansa tự làm khi PR hiện tại đã merge xong, và review chéo PR khi người dùng yêu cầu.
description_en: "Shows the chat's GitHub repos (branch, PR, CI, merge), queues the next job, which Thansa starts on its own once the current PR is merged, and cross-reviews a PR when the user asks."
author: Thansa (bundled)
enabled: true
min_mode: safe
tools:
  - thansa_github
hooks: []
