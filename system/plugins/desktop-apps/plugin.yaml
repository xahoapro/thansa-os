name: Điều khiển app trên máy
name_en: "Control apps on this computer"
slug: desktop-apps
version: 1.0.0
description: Mở, đóng và liệt kê ứng dụng trên CHÍNH MÁY đang chạy Thansa (Windows, macOS, Linux có màn hình) theo lời người dùng, ví dụ "mở Chrome", "tắt Excel", "đang mở app nào". Tự chặn và nói rõ khi Thansa chạy trong Docker trên máy chủ, vì khi đó máy chạy Thansa không phải máy của người dùng.
description_en: "Opens, closes and lists apps on THE MACHINE running Thansa (Windows, macOS, Linux with a screen) when you ask, e.g. \"open Chrome\", \"close Excel\", \"which apps are open\". Blocks itself and says so when Thansa runs in Docker on a server, because then the machine running Thansa is not yours."
author: Thansa (bundled)
enabled: true
min_mode: safe
tools:
  - thansa_app_list
  - thansa_app_open
  - thansa_app_close
hooks: []
