name: Thời gian & ngày
name_en: "Date & time"
slug: datetime-vn
version: 1.0.1
description: Xem ngày giờ hiện tại theo múi giờ chọn ở Cài đặt và tính ngày tương đối (mai, mốt, N ngày nữa, tuần trước). Thuần stdlib, chỉ đọc, không cần mạng.
description_en: "Shows the current date and time in the timezone picked in Settings and works out relative dates (tomorrow, in N days, last week). Pure stdlib, read-only, no network needed."
author: Thansa (bundled)
enabled: true
min_mode: readonly
tools:
  - thansa_now
  - thansa_date_add
hooks: []
