# Mapping — "tôi đã sửa những gì, ở đâu, vì sao, và làm sao biết nó còn sống?"
# (DAC-TA-THANSA-OS.md mục 2.2)
#
# Danh sách patch hiện RỖNG — GĐ2 thêm P001+. Mỗi patch một mục, BẮT BUỘC đủ 7 trường:
#
#   - id: P00x
#     ten: "tên ngắn gọn"
#     y_dinh: >            # bạn muốn gì — nền tảng quyết định giữ/bỏ/neo lại
#     commit: "[me] ..."   # subject commit [me], khớp git log (tự kiểm chứng luật 1)
#     diem_neo:            # chỗ đấu nối, neo bằng KÝ HIỆU (tên hàm/id DOM/key i18n/
#       - file: ...        # chuỗi hằng). TUYỆT ĐỐI không neo số dòng
#         ky_hieu: ...
#     vung_theo_doi:       # upstream đụng đây → patch phải xem lại (đầu vào bộ dò)
#       - duong/dan hoặc "duong/dan: ghi chú"
#     anh_goc:             # ảnh chụp đoạn mã upstream NGAY TRƯỚC khi sửa (bắt ca
#       - file: ...        # upstream viết lại đúng đoạn đã đè); file MỚI hoàn toàn
#         doan: ...        # thì để danh sách rỗng
#     kiem_chung: >        # cách chứng minh patch còn tác dụng (chống chết âm thầm)
#     dieu_kien_bo: >      # khi nào nên bỏ patch dùng bản chính thức upstream

- id: P001
  ten: "Fallback tên hiển thị Thansa OS"
  y_dinh: >
    Máy mới chưa đặt workspace_name phải thấy "Thansa OS" ở mọi nơi đọc fallback:
    sidebar, overview, account, 2FA issuer, settings mặc định. KHÔNG đổi tên biến
    WORKSPACE_NAME hay key workspace_name.
  commit: "[me] P001: fallback ten hien thi Thansa OS"
  diem_neo:
    - file: env.example
      ky_hieu: "WORKSPACE_NAME="
    - file: server/main.py
      ky_hieu: 'os.getenv("WORKSPACE_NAME"'
    - file: dashboard/console.js
      ky_hieu: 'id="acWs"'
    - file: server/config.py
      ky_hieu: "_DEFAULT"
  vung_theo_doi:
    - env.example
    - "server/main.py: các fallback workspace_name (otpauth_uri, settings general, /settings GET)"
    - "server/config.py: dict _DEFAULT sinh settings.json lần đầu"
    - dashboard/console.js
  anh_goc:
    - file: env.example
      doan: "WORKSPACE_NAME=Javis OS"
    - file: server/main.py
      doan: '"workspace_name": s.get("workspace_name") or os.getenv("WORKSPACE_NAME", "Javis OS"),'
    - file: dashboard/console.js
      doan: 'const wn = document.getElementById("workspaceName"); if (wn) wn.textContent = document.getElementById("acWs").value.trim() || "Javis OS";'
    - file: server/config.py
      doan: '"workspace_name": "Javis OS",'
  kiem_chung: >
    grep '|| "Javis OS"' trong dashboard/console.js và server/main.py = 0;
    env.example có WORKSPACE_NAME=Thansa OS; khởi động sạch (xoá settings.json) rồi
    GET /settings trả "workspace_name":"Thansa OS"; máy chưa cấu hình mở dashboard
    thấy "Thansa OS" ở sidebar/overview/account.
  dieu_kien_bo: >
    Upstream đưa toàn bộ chuỗi hiển thị vào i18n/branding config thì bỏ patch,
    dùng cấu hình chính thức.

- id: P003
  ten: "Chrome sản phẩm: title, login, welcome, thẻ cập nhật, thông báo"
  y_dinh: >
    Tab trình duyệt, sidebar (alt logo), màn đăng nhập, cửa sổ chào mừng/wizard,
    thẻ "Cập nhật"/"Tổng quan", khung thông báo và thông báo bản phát hành đều hiện
    "Thansa OS"/"Thansa". KHÔNG đổi tên trợ lý ở bề mặt cài đặt/chat (91, 341, 419,
    501, 632, 643-644, 668, 688 trong index.html; 2822, 5071 console.js; FastAPI
    title, vault template 3837/3859, skill-msg 4476 main.py — để lại, chờ chủ quyết
    vòng sau), KHÔNG đụng comment kỹ thuật/định danh JS (JavisBackground,
    JavisEditorCmds, JavisSessions).
  commit: "[me] P003: chrome san pham - title, login, welcome, the cap nhat, thong bao"
  diem_neo:
    - file: dashboard/index.html
      ky_hieu: "<title>"
    - file: dashboard/index.html
      ky_hieu: 'id="authTitle"'
    - file: dashboard/index.html
      ky_hieu: 'id="wzWsName"'
    - file: dashboard/console.js
      ky_hieu: "upd-name"
    - file: dashboard/notifications.js
      ky_hieu: "noti-empty"
    - file: server/main.py
      ky_hieu: '"id": f"release:'
  vung_theo_doi:
    - dashboard/index.html
    - dashboard/console.js
    - dashboard/notifications.js
    - "server/main.py: khối dựng thông báo release"
  anh_goc:
    - file: dashboard/index.html
      doan: "<title>Javis OS</title>"
    - file: dashboard/index.html
      doan: '<span class="brand-text">JAVIS OS</span>'
    - file: dashboard/index.html
      doan: '<div class="fm-head"><img src="/brand-logo" alt="" style="width:24px;height:24px;border-radius:6px;vertical-align:middle;margin-right:6px;object-fit:cover"><span id="authTitle">Đăng nhập Javis</span></div>'
    - file: dashboard/console.js
      doan: '<div class="upd-title"><span class="upd-name">Javis OS</span><span class="gcard-tag" id="updVerTag">…</span></div>'
    - file: server/main.py
      doan: '"title": f"Javis OS v{rel.get(''version'')}",'
  kiem_chung: >
    grep -i "javis os" trong dashboard/index.html, dashboard/notifications.js = 0
    (kiểm cả chữ HOA — brand topbar từng viết "JAVIS OS"); <title> = Thansa OS;
    brand topbar hiện "THANSA OS"; màn đăng nhập hiện "Đăng nhập Thansa"; wizard
    chào mừng hiện "Chào mừng tới Thansa"; thẻ cập nhật/tổng quan hiện "Thansa OS";
    các chuỗi Javis còn lại trong index.html chỉ thuộc danh sách để-lại khai ở y_dinh.
  dieu_kien_bo: >
    Upstream đưa toàn bộ chuỗi hiển thị vào i18n/branding config thì bỏ patch,
    dùng cấu hình chính thức.
