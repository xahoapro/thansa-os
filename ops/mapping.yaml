    áp vào _parse_changelog (toàn văn md) + _parse_announcements (title/summary/
    body/label). Chủ chốt 18/08 (lần 2): trang Nhật ký là trang ĐỌC TIN → quét SẠCH
    mọi dạng javis kể cả token kỹ thuật trong lời kể (javis_*→thansa_*,
    JAVIS_*→THANSA_*…); tên THẬT trong code/hệ thống không đổi — đánh đổi được
    chấp nhận: lời kể cũ nhắc tên biến/file sẽ hiện tên rebrand, ai cần tên thật
    xem tài liệu. Ngoại lệ: URL javisos.com giữ nguyên. id/url/kind không lọc.
    Mọi bản cập nhật tương lai của upstream tự hiện Thansa, không cần đụng CHANGELOG.
