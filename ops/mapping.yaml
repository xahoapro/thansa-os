  kiem_chung: >
    /docs hiện "Thansa OS"; grep '"Javis OS"' trong server/oauth_mcp.py,
    server/codex_models.py, server/totp.py, server/engine.py = 0; grep 'Javis'
    (đứng độc lập, không phải Javis/ hay JAVIS_) trong các chuỗi hiển thị
    dashboard/*.js *.html *.css = 0 ngoài app.js (P010) và danh sách GIỮ khai
    ở y_dinh; JS còn parse được (node --check), python còn parse (ast).
  dieu_kien_bo: >
    Upstream đưa toàn bộ chuỗi hiển thị vào i18n/branding config thì bỏ patch,
