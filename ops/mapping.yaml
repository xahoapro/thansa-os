# Mapping — "tôi đã sửa những gì, ở đâu, vì sao, và làm sao biết nó còn sống?"
# (DAC-TA-THANSA-OS.md mục 2.2)
#
# Danh sách patch hiện RỖNG — GĐ2 thêm P001+. Mỗi patch một mục, BẮT BUỘC đủ 7 trường:
#
#   - id: P00x
#     ten: "tên ngắn gọn"
#     y_dinh: >            # bạn muốn gì — nền tảng quyết định giữ/bỏ/neo lại
#     commit: "[me] ..."   # subject commit [me], khớp git log (tự kiểm chứng luật 1)
#     diem_neo:            # chỗ đấu nối, neo bằng KÝ HIỆU (tên hàm/id DOM/key i18n/
#       - file: ...        # chuỗi hằng). TUYỆT ĐỐI không neo số dòng
#         ky_hieu: ...
#     vung_theo_doi:       # upstream đụng đây → patch phải xem lại (đầu vào bộ dò)
#       - duong/dan hoặc "duong/dan: ghi chú"
#     anh_goc:             # ảnh chụp đoạn mã upstream NGAY TRƯỚC khi sửa (bắt ca
#       - file: ...        # upstream viết lại đúng đoạn đã đè); file MỚI hoàn toàn
#         doan: ...        # thì để danh sách rỗng
#     kiem_chung: >        # cách chứng minh patch còn tác dụng (chống chết âm thầm)
#     dieu_kien_bo: >      # khi nào nên bỏ patch dùng bản chính thức upstream

- id: P001
  ten: "Fallback tên hiển thị Thansa OS"
  y_dinh: >
    Máy mới chưa đặt workspace_name phải thấy "Thansa OS" ở mọi nơi đọc fallback:
    sidebar, overview, account, 2FA issuer, settings mặc định. KHÔNG đổi tên biến
    WORKSPACE_NAME hay key workspace_name.
  commit: "[me] P001: fallback ten hien thi Thansa OS"
  diem_neo:
    - file: env.example
      ky_hieu: "WORKSPACE_NAME="
    - file: server/main.py
      ky_hieu: 'os.getenv("WORKSPACE_NAME"'
    - file: dashboard/console.js
      ky_hieu: 'id="acWs"'
    - file: server/config.py
      ky_hieu: "_DEFAULT"
  vung_theo_doi:
    - env.example
    - "server/main.py: các fallback workspace_name (otpauth_uri, settings general, /settings GET)"
    - "server/config.py: dict _DEFAULT sinh settings.json lần đầu"
    - dashboard/console.js
  anh_goc:
    - file: env.example
      doan: "WORKSPACE_NAME=Javis OS"
    - file: server/main.py
      doan: '"workspace_name": s.get("workspace_name") or os.getenv("WORKSPACE_NAME", "Javis OS"),'
    - file: dashboard/console.js
      doan: 'const wn = document.getElementById("workspaceName"); if (wn) wn.textContent = document.getElementById("acWs").value.trim() || "Javis OS";'
    - file: server/config.py
      doan: '"workspace_name": "Javis OS",'
  kiem_chung: >
    grep '|| "Javis OS"' trong dashboard/console.js và server/main.py = 0;
    env.example có WORKSPACE_NAME=Thansa OS; khởi động sạch (xoá settings.json) rồi
    GET /settings trả "workspace_name":"Thansa OS"; máy chưa cấu hình mở dashboard
    thấy "Thansa OS" ở sidebar/overview/account.
  dieu_kien_bo: >
    Upstream đưa toàn bộ chuỗi hiển thị vào i18n/branding config thì bỏ patch,
    dùng cấu hình chính thức.

- id: P003
  ten: "Chrome sản phẩm: title, login, welcome, thẻ cập nhật, thông báo"
  y_dinh: >
    Tab trình duyệt, sidebar (alt logo), màn đăng nhập, cửa sổ chào mừng/wizard,
    thẻ "Cập nhật"/"Tổng quan", khung thông báo và thông báo bản phát hành đều hiện
    "Thansa OS"/"Thansa". KHÔNG đổi tên trợ lý ở bề mặt cài đặt/chat (91, 341, 419,
    501, 632, 643-644, 668, 688 trong index.html; 2822, 5071 console.js; FastAPI
    title, vault template 3837/3859, skill-msg 4476 main.py — để lại, chờ chủ quyết
    vòng sau), KHÔNG đụng comment kỹ thuật/định danh JS (JavisBackground,
    JavisEditorCmds, JavisSessions).
  commit: "[me] P003: chrome san pham - title, login, welcome, the cap nhat, thong bao"
  diem_neo:
    - file: dashboard/index.html
      ky_hieu: "<title>"
    - file: dashboard/index.html
      ky_hieu: 'id="authTitle"'
    - file: dashboard/index.html
      ky_hieu: 'id="wzWsName"'
    - file: dashboard/console.js
      ky_hieu: "upd-name"
    - file: dashboard/notifications.js
      ky_hieu: "noti-empty"
    - file: server/main.py
      ky_hieu: '"id": f"release:'
  vung_theo_doi:
    - dashboard/index.html
    - dashboard/console.js
    - dashboard/notifications.js
    - "server/main.py: khối dựng thông báo release"
  anh_goc:
    - file: dashboard/index.html
      doan: "<title>Javis OS</title>"
    - file: dashboard/index.html
      doan: '<span class="brand-text">JAVIS OS</span>'
    - file: dashboard/index.html
      doan: '<div class="fm-head"><img src="/brand-logo" alt="" style="width:24px;height:24px;border-radius:6px;vertical-align:middle;margin-right:6px;object-fit:cover"><span id="authTitle">Đăng nhập Javis</span></div>'
    - file: dashboard/console.js
      doan: '<div class="upd-title"><span class="upd-name">Javis OS</span><span class="gcard-tag" id="updVerTag">…</span></div>'
    - file: server/main.py
      doan: '"title": f"Javis OS v{rel.get(''version'')}",'
  kiem_chung: >
    grep -i "javis os" trong dashboard/index.html, dashboard/notifications.js = 0
    (kiểm cả chữ HOA — brand topbar từng viết "JAVIS OS"); <title> = Thansa OS;
    brand topbar hiện "THANSA OS"; màn đăng nhập hiện "Đăng nhập Thansa"; wizard
    chào mừng hiện "Chào mừng tới Thansa"; thẻ cập nhật/tổng quan hiện "Thansa OS";
    các chuỗi Javis còn lại trong index.html chỉ thuộc danh sách để-lại khai ở y_dinh.
  dieu_kien_bo: >
    Upstream đưa toàn bộ chuỗi hiển thị vào i18n/branding config thì bỏ patch,
    dùng cấu hình chính thức.

- id: P004
  ten: "i18n vi/en: nhãn hiển thị Thansa"
  y_dinh: >
    Nhãn trang và câu hint dùng "Javis" như TÊN sản phẩm/trợ lý trong 2 file i18n
    hiển thị → "Thansa". KHÔNG đổi key i18n, không đổi file khác trong dashboard/i18n/.
  commit: "[me] P004: i18n vi/en - nhan hien thi Thansa"
  diem_neo:
    - file: dashboard/i18n/vi.json
      ky_hieu: '"page.home.label"'
    - file: dashboard/i18n/en.json
      ky_hieu: '"page.home.label"'
  vung_theo_doi:
    - dashboard/i18n/
  anh_goc:
    - file: dashboard/i18n/vi.json
      doan: '"page.home.label": "Javis",'
    - file: dashboard/i18n/en.json
      doan: '"page.terminal.sub": "A real shell on the machine running Javis",'
  kiem_chung: >
    grep -i javis dashboard/i18n/vi.json dashboard/i18n/en.json = 0; hai file vẫn là
    JSON hợp lệ; đổi ngôn ngữ vi/en trên dashboard: nhãn trang chủ hiện "Thansa".
  dieu_kien_bo: >
    Upstream thêm key i18n riêng cho tên thương hiệu (branding key) thì bỏ patch,
    điền giá trị qua cấu hình.

- id: P005
  ten: "Compose: image GHCR trỏ thansa-os"
  y_dinh: >
    Máy Docker kéo đúng ảnh bản Thansa: ghcr.io/xahoapro/thansa-os:latest (workflow
    docker-publish của upstream dùng ${GITHUB_REPOSITORY,,} nên repo thansa-os tự đẩy
    ảnh đúng tên). Không đổi gì khác trong compose.
  commit: "[me] P005: compose image ghcr.io/xahoapro/thansa-os"
  diem_neo:
    - file: docker-compose.yml
      ky_hieu: "ghcr.io/xahoapro/thansa-os"
    - file: docker-compose.build.yml
      ky_hieu: "ghcr.io/xahoapro/thansa-os"
    - file: docker-compose.hostinger.yml
      ky_hieu: "ghcr.io/xahoapro/thansa-os"
  vung_theo_doi:
    - docker-compose.yml
    - docker-compose.build.yml
    - docker-compose.hostinger.yml
  anh_goc:
    - file: docker-compose.yml
      doan: "image: ghcr.io/blogminhquy/javis-os:latest"
  kiem_chung: >
    grep "image:.*javis-os" docker-compose*.yml = 0; 3 file compose trỏ
    ghcr.io/xahoapro/thansa-os:latest.
  dieu_kien_bo: >
    Upstream tham số hoá image trong compose (biến env/override mẫu) thì bỏ patch,
    đặt qua biến.

- id: P007
  ten: "Danh tính trợ lý: bot nói/hiện ra là Thansa"
  y_dinh: >
    Mọi chuỗi CHAT-FACING ở server (persona CORE_CONTRACT, khối context bơm vào
    prompt, tin bot gửi qua Zalo/Telegram/voice/STT, thông báo write-gate/lỗi trả
    người dùng, tiêu đề cửa sổ Windows) dùng "Thansa" thay "Javis". GIỮ nguyên:
    Javis/ (đường dẫn), JAVIS_* (env), javis_* (tool), comment/docstring. Cặp marker
    "# === NĂNG LỰC THANSA" ở main.py và context_runtime.py phải đổi CÙNG NHAU.
    NGOẠI LỆ coupled test (được phép, ghi sổ trộn): tests/fixtures/
    context_compiler_contract.json đổi required/forbidden terms theo persona mới;
    cùng lớp đó, 7 file test bám chuỗi bot nói được đồng bộ Javis→Thansa:
    bao_viec_ve_chat_web, bot_noi_nhu_nguoi, cli_kenh, codex_context, connect_health,
    loi_ket_noi_google, terminal_cmd_goc.
  commit: "[me] P007: danh tinh tro ly Thansa (chat-facing server)"
  diem_neo:
    - file: server/context_compiler.py
      ky_hieu: "CORE_CONTRACT"
    - file: server/context_runtime.py
      ky_hieu: "capability_summary_chars"
    - file: server/stt.py
      ky_hieu: "MARK_THOAI"
    - file: tests/fixtures/context_compiler_contract.json
      ky_hieu: '"required_terms"'
  vung_theo_doi:
    - server/context_compiler.py
    - server/context_runtime.py
    - server/channel_context.py
    - server/stt.py
    - server/zalo_bot.py
    - server/telegram_bot.py
    - "server/main.py: chuỗi thông báo người dùng + write-gate + khối context"
    - server/compaction.py
    - server/engine.py
    - server/antigravity_cli.py
    - server/readonly_orchestrator.py
    - server/connect_health.py
    - server/learn.py
    - server/self_improve.py
    - tests/fixtures/context_compiler_contract.json
  anh_goc:
    - file: server/context_compiler.py
      doan: "Bạn là Javis, trợ lý agentic làm việc trong đúng brain và kênh của task hiện tại."
    - file: server/context_runtime.py
      doan: '("capability_summary_chars", "# === NĂNG LỰC JAVIS"),'
    - file: server/zalo_bot.py
      doan: 'await self._send(client, chat, "Bạn không có quyền dùng bot Javis này.")'
    - file: tests/fixtures/context_compiler_contract.json
      doan: '"Bạn là Javis",'
  kiem_chung: >
    tests/run.py context_compiler_phase4 XANH; hỏi bot "bạn là ai" → tự xưng Thansa;
    grep -rn 'Bạn là Javis' server/ = 0; grep các mẫu chat "Javis (chưa|đã|không|nghe|
    đang|tự)" trong server/*.py chỉ còn trong comment/docstring.
  dieu_kien_bo: >
    Upstream đưa tên trợ lý vào branding config (biến persona) thì bỏ patch, đặt
    qua cấu hình.
