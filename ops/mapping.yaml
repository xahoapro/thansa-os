  vung_theo_doi:
    - dashboard/app.js
  anh_goc:
    - file: dashboard/app.js
      doan: 'wn.textContent = cfg.workspace_name || "Javis OS";'
    - file: dashboard/app.js
      doan: 'document.getElementById("setWsName").value.trim() || "Javis OS"; });'
  kiem_chung: >
    node --check dashboard/app.js OK; git diff của patch đúng 2 dòng; mở dashboard
    không lỗi console, #workspaceName hiện "Thansa OS" khi chưa cấu hình.
