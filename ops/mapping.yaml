    nên sửa bằng thao tác BYTE (không qua editor), diff đúng 2 dòng, phần còn
    lại byte-for-byte. Không đụng bất cứ gì khác trong app.js (mọi chuỗi
    "Javis" hiển thị khác của app.js để vòng sau nếu chủ muốn — xem bao-cao).
  commit: "[me] P010: app.js 2 fallback workspaceName Thansa OS"
