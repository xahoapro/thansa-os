    - "website/index.html; dashboard/console.js + index.html (link tài liệu); server/routes/domain.py"
    - "dashboard/changelog-thansa.json; tests/python/test_zalo_mcp.py (guide_url coupled)"
  anh_goc:
    - file: LICENSE
      doan: "Copyright (c) 2026 Nguyễn Minh Quý (blogminhquy)"
    - file: server/main.py
      doan: 's = s.replace("javisos.com", _REBRAND_GIU)'
    - file: Dockerfile
