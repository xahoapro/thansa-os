    thẻ "Cập nhật"/"Tổng quan", khung thông báo và thông báo bản phát hành đều hiện
    "Thansa OS"/"Thansa". KHÔNG đổi tên trợ lý ở bề mặt cài đặt/chat (91, 341, 419,
    501, 632, 643-644, 668, 688 trong index.html; 2822, 5071 console.js; FastAPI
