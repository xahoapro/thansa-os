[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thansa-cli"
version = "0.17.0"
description = "Thansa CLI - nói chuyện với Thansa OS từ terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Thansa OS" }]
keywords = ["thansa", "cli", "ai", "agent", "second-brain"]

# CHỈ httpx. Đây là một luật, không phải sự tình cờ: gói này phải cài được trên máy chưa từng
# có Thansa, và mọi thứ kéo thêm (fastapi, uvicorn, rich...) đều là thứ người dùng phải tải về
# chỉ để gõ một câu hỏi. Có test canh đúng danh sách này.
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/xahoapro/thansa-os"
Documentation = "https://github.com/xahoapro/thansa-os/blob/main/docs/dev/2026-08-cli-spec.md"

[project.scripts]
thansa = "thansa_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["thansa_cli*"]
