name: Desktop installers

# Builds the two files a person downloads to install Thansa like an app:
#   ThansaOS-Setup.exe   (Windows, Inno Setup)   packaging/windows/
#   ThansaOS-macOS.dmg   (macOS, drag to Applications)   packaging/macos/
# and publishes them on the fixed release tag "desktop", so the download links never change:
#   https://github.com/xahoapro/thansa-os/releases/download/desktop/ThansaOS-Setup.exe
#   https://github.com/xahoapro/thansa-os/releases/download/desktop/ThansaOS-macOS.dmg
#
# Both installers are thin: they clone the newest Thansa on first run, so they only need a
# rebuild when the installer files themselves change, not on every release.
on:
  push:
    branches: [ main, 'claude/**' ]
    paths:
      - "packaging/**"
      - "install.ps1"
      - "install.sh"
      - "open-thansa.vbs"
      - "start-thansa.vbs"
      - "bin/thansa-start.sh"
      - "bin/thansa-autostart.sh"
      - ".github/workflows/desktop-installers.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "install.ps1"
      - "install.sh"
      - "open-thansa.vbs"
      - "start-thansa.vbs"
      - "bin/thansa-start.sh"
      - "bin/thansa-autostart.sh"
      - ".github/workflows/desktop-installers.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      # Parse every PowerShell file the installers run, with the parser of Windows PowerShell 5.1
      # (what customers have), so a syntax slip fails here instead of on a customer's PC.
      - name: PowerShell syntax check
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in @("install.ps1", "stop-thansa.ps1", "thansa-autostart.ps1", "packaging\windows\bootstrap.ps1", "packaging\windows\get-thansa.ps1")) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs) { $bad++; $errs | ForEach-Object { Write-Host "::error file=$f::$($_.Message) (line $($_.Extent.StartLineNumber))" } }
            else { Write-Host "ok  $f" }
          }
          if ($bad) { exit 1 }

      # Vietnamese wizard text is an unofficial Inno translation, not bundled with the compiler.
      - name: Vietnamese wizard text (best-effort)
        shell: pwsh
        run: |
          try {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/Vietnamese.isl" -OutFile packaging/windows/Vietnamese.isl -UseBasicParsing
          } catch { Write-Host "Vietnamese.isl unavailable, building English only: $($_.Exception.Message)" }

      # Code signing is OPTIONAL and off until the owner adds two repository secrets:
      #   WINDOWS_CERT_PFX_BASE64  the code signing certificate (.pfx) as base64
      #   WINDOWS_CERT_PASSWORD    its password
      # With them, Inno Setup signs both the setup .exe and its uninstaller (SignTool=thansa in
      # thansa-setup.iss), so Windows shows the publisher name instead of "Unknown publisher".
      # Without them the build is unsigned, exactly as before. Fork PRs never see secrets.
      - name: Build ThansaOS-Setup.exe
        shell: pwsh
        env:
          CERT_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CERT_PWD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $v = (Get-Content VERSION -Raw).Trim()
          $sign = @()
          if ($env:CERT_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP "thansa-sign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CERT_B64))
            $tool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $tool) { throw "signtool.exe not found" }
            # Inno replaces $f with the file to sign and $q with a double quote.
            $sign = @("/DSign", "/Sthansa=`$q$($tool.FullName)`$q sign /f `$q$pfx`$q /p `$q$($env:CERT_PWD)`$q /fd sha256 /tr http://timestamp.digicert.com /td sha256 `$f")
            Write-Host "Signing enabled"
          } else {
            Write-Host "No WINDOWS_CERT_PFX_BASE64 secret: building unsigned"
          }
          & $env:ISCC "/DAppVersion=$v" @sign packaging\windows\thansa-setup.iss
          if ($LASTEXITCODE -ne 0 -and (Test-Path packaging/windows/Vietnamese.isl)) {
            # A translation written for a newer Inno can carry messages this compiler rejects:
            # ship English rather than no installer at all.
            Write-Host "::warning::Build with Vietnamese.isl failed, retrying English only"
            Remove-Item packaging/windows/Vietnamese.isl
            & $env:ISCC "/DAppVersion=$v" @sign packaging\windows\thansa-setup.iss
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($env:CERT_B64) {
            Remove-Item $pfx -Force
            $sig = Get-AuthenticodeSignature dist\ThansaOS-Setup.exe
            Write-Host "Signature: $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne "Valid") { throw "ThansaOS-Setup.exe is not validly signed" }
          }
          Get-Item dist\ThansaOS-Setup.exe | Format-List Name, Length

      # Real install of THIS commit on a clean runner, all four CLI brains included: bootstrap
      # clones the checkout and runs install.ps1 (venv, deps, Claude Code, Codex, Antigravity,
      # Grok, autostart). Then the server's own finders must see all four brains, and Thansa
      # must answer /health.
      - name: Smoke test - full install, four brains, Thansa starts
        shell: pwsh
        timeout-minutes: 45
        run: |
          git branch -f smoke-install HEAD
          $dir = Join-Path $env:RUNNER_TEMP "ThansaOS"
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\bootstrap.ps1 -Dir $dir -Repo $env:GITHUB_WORKSPACE -Branch smoke-install -NoPause -LogFile (Join-Path $env:RUNNER_TEMP "install.log")
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:RUNNER_TEMP "install.log") -Tail 80; exit 1 }
          $vpy = Join-Path $dir ".venv\Scripts\python.exe"
          if (-not (Test-Path $vpy)) { throw "venv missing" }
          if (-not (Test-Path (Join-Path $dir "open-thansa.vbs"))) { throw "open-thansa.vbs missing" }
          & $vpy (Join-Path $dir "packaging\check_brains.py")
          if ($LASTEXITCODE -ne 0) { throw "a brain CLI is missing after install" }
          Start-Process wscript.exe -ArgumentList "//nologo `"$dir\start-thansa.vbs`"" -WorkingDirectory $dir
          $ok = $false
          for ($i = 0; $i -lt 90; $i++) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://127.0.0.1:7777/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break } } catch { }
          }
          if (-not $ok) { Get-Content (Join-Path $dir "server\thansa.log") -Tail 80 -ErrorAction SilentlyContinue; throw "Thansa did not answer /health" }
          Write-Host "Thansa is up after a fresh install"
          & (Join-Path $dir "stop-thansa.bat")

      - uses: actions/upload-artifact@v4
        with:
          name: ThansaOS-Setup
          path: dist/ThansaOS-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build ThansaOS-macOS.dmg
        run: bash packaging/macos/build-dmg.sh

      - name: Check the disk image
        run: |
          set -e
          mnt="$(hdiutil attach -nobrowse -readonly dist/ThansaOS-macOS.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')"
          app="$mnt/THANSA OS.app"
          test -x "$app/Contents/MacOS/thansa"
          test -f "$app/Contents/Resources/bootstrap.sh"
          test -f "$app/Contents/Resources/thansa.icns"
          test -L "$mnt/Applications"
          plutil -lint "$app/Contents/Info.plist"
          bash -n "$app/Contents/MacOS/thansa"
          bash -n "$app/Contents/Resources/bootstrap.sh"
          bash -n packaging/macos/get-thansa.sh
          test -f "$mnt/.VolumeIcon.icns"
          GetFileInfo -a "$mnt" | grep -q C && echo "volume has the Thansa icon" || echo "::warning::volume custom-icon flag not set"
          hdiutil detach "$mnt"

      # The same first-run path a customer takes (bootstrap.sh -> install.sh), on this commit:
      # clone, venv, Node, all four CLI brains, LaunchAgent. The runner already has the
      # Command Line Tools and a Python 3.10+, so the xcode-select and uv branches are skipped.
      - name: Smoke test - full install, four brains, Thansa starts
        timeout-minutes: 45
        run: |
          set -e
          git branch -f smoke-install HEAD
          export THANSA_HOME="$RUNNER_TEMP/ThansaOS" THANSA_REPO="$GITHUB_WORKSPACE" THANSA_BRANCH=smoke-install
          bash packaging/macos/bootstrap.sh < /dev/null
          export PATH="$HOME/.local/bin:$HOME/.thansa/node/bin:$PATH"
          "$THANSA_HOME/.venv/bin/python" "$THANSA_HOME/packaging/check_brains.py"
          for i in $(seq 1 60); do
            curl -sf -m 3 -o /dev/null http://127.0.0.1:7777/health && { echo "Thansa is up after a fresh install"; exit 0; }
            sleep 2
          done
          tail -80 "$THANSA_HOME/server/thansa.log" 2>/dev/null || true
          echo "Thansa did not answer /health"; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ThansaOS-macOS
          path: dist/ThansaOS-macOS.dmg
          if-no-files-found: error

  publish:
    needs: [ windows, macos ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish on the "desktop" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          v="$(tr -d ' \r\n' < VERSION)"
          notes="Desktop installers for THANSA OS (built from ${v}). They install the newest Thansa on first run.

          - Windows 10/11: ThansaOS-Setup.exe
          - macOS 11+: ThansaOS-macOS.dmg

          Steps: QUICKSTART.md (Tiếng Việt) or QUICKSTART.en.md (English)."
          if ! gh release view desktop >/dev/null 2>&1; then
            gh release create desktop --title "THANSA OS - Windows & macOS installers" --notes "$notes" --latest=false
          else
            gh release edit desktop --notes "$notes"
          fi
          gh release upload desktop out/ThansaOS-Setup.exe out/ThansaOS-macOS.dmg --clobber
          echo "Published installers from ${v}" >> "$GITHUB_STEP_SUMMARY"
